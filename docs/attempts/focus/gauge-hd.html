<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>FOCO · 1H BAR</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <style>
      :root {
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --item-a: #98a098;
        --item-b: #8b9bb4;
        --item-rest: #6e6e6e;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1c1b1c;
        color: #fff;
        font-family:
          'Pretendard Variable',
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          system-ui,
          'Apple SD Gothic Neo',
          'Noto Sans KR',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .board {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .gauge {
        position: relative;
        width: 100%;
        padding: 0;
      }

      .gauge__label,
      .gauge__timer,
      .gauge__legend {
        padding: 0 40px;
      }

      .gauge__label,
      .gauge__timer {
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .gauge__label {
        font-size: 36px;
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.92);
      }

      .gauge__timer {
        margin-top: 8px;
        font-size: 112px;
        font-weight: 200;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .gauge__bar {
        position: relative;
        height: 8px;
        margin-top: 28px;
        background: #494949;
      }

      .gauge__fill {
        position: absolute;
        top: 0;
        bottom: 0;
        background: var(--item-color);
      }

      .gauge__fill.is-active {
        background: linear-gradient(to right, var(--item-color) max(0px, calc(100% - 72px)), #fff);
      }

      .gauge__fill.is-rest.is-active {
        background: linear-gradient(
          to right,
          var(--item-color) max(0px, calc(100% - 72px)),
          rgba(255, 255, 255, 0.55)
        );
      }

      .gauge__fill.is-active::after {
        content: '';
        position: absolute;
        top: 50%;
        right: -8px;
        width: 16px;
        height: 16px;
        margin-top: -8px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0 28%, rgba(255, 255, 255, 0.45) 48%, transparent 72%);
        animation: focus-twinkle 1.6s ease-in-out infinite;
      }

      @keyframes focus-twinkle {
        0%,
        100% {
          transform: scale(0.75);
          opacity: 0.55;
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
        }
        50% {
          transform: scale(1.3);
          opacity: 1;
          box-shadow: 0 0 16px 5px rgba(255, 255, 255, 0.45);
        }
      }

      .gauge__tick {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: rgba(255, 255, 255, 0.55);
        transform: translateX(-50%);
      }

      .gauge__ray {
        position: absolute;
        width: 100%;
        height: 8px;
        transform-origin: 0 0;
        pointer-events: none;
        animation: focus-ray-in 0.9s var(--ease-out) backwards;
      }

      .gauge__ray::before,
      .gauge__ray::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(217, 217, 217, 0.24);
      }

      .gauge__ray::before {
        mask-image: linear-gradient(to right, #000 15%, transparent 55%);
      }

      .gauge__ray::after {
        inset: -16px 0;
        background: linear-gradient(
          transparent 16px,
          rgba(217, 217, 217, 0.24) 16px,
          rgba(217, 217, 217, 0.24) calc(100% - 16px),
          transparent calc(100% - 16px)
        );
        filter: blur(6px);
        mask-image: linear-gradient(to right, transparent 10%, #000 45%, rgba(0, 0, 0, 0.35) 100%);
      }

      .gauge__ray--up {
        top: -32px;
        left: -6px;
        --ray-angle: -45deg;
        transform: rotate(var(--ray-angle));
      }

      .gauge__ray--down {
        top: 32px;
        left: 4px;
        --ray-angle: 45deg;
        transform: rotate(var(--ray-angle));
        animation-delay: 0.08s;
      }

      @keyframes focus-ray-in {
        from {
          transform: rotate(var(--ray-angle)) scaleX(0);
        }
      }

      .gauge__legend {
        display: flex;
        justify-content: center;
        gap: 28px;
        margin-top: 48px;
        font-size: 18px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.55);
      }

      .gauge__legend span {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .gauge__swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        background: var(--c);
      }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="gauge">
        <p class="gauge__label">1H BAR</p>
        <p class="gauge__timer">42:00</p>
        <div class="gauge__bar" role="img" aria-label="이번 1시간 바">
          <span class="gauge__ray gauge__ray--up" aria-hidden="true"></span>
          <span class="gauge__ray gauge__ray--down" aria-hidden="true"></span>
          <!-- 0–38% subject A, 38–46% rest, 46–70% subject B (active tip) -->
          <span class="gauge__fill" style="left: 0%; width: 38%; --item-color: var(--item-a)"></span>
          <span
            class="gauge__fill is-rest"
            style="left: 38%; width: 8%; --item-color: var(--item-rest)"
          ></span>
          <span
            class="gauge__fill is-active"
            style="left: 46%; width: 24%; --item-color: var(--item-b)"
          ></span>
          <span class="gauge__tick" style="left: 0%"></span>
          <span class="gauge__tick" style="left: 20%"></span>
          <span class="gauge__tick" style="left: 40%"></span>
          <span class="gauge__tick" style="left: 60%"></span>
          <span class="gauge__tick" style="left: 80%"></span>
          <span class="gauge__tick" style="left: 100%"></span>
        </div>
        <div class="gauge__legend" aria-hidden="true">
          <span><i class="gauge__swatch" style="--c: var(--item-a)"></i>집중</span>
          <span><i class="gauge__swatch" style="--c: var(--item-rest)"></i>휴식</span>
          <span><i class="gauge__swatch" style="--c: #494949"></i>남은 시간</span>
        </div>
      </div>
    </div>
  </body>
</html>
