<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="1H BAR 42:00">
  <defs>
    <linearGradient id="activeTip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b9bb4"/>
      <stop offset="78%" stop-color="#8b9bb4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="tipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="28%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="48%" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="72%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rayFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9d9d9" stop-opacity="0.28"/>
      <stop offset="15%" stop-color="#d9d9d9" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#d9d9d9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayBlur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="10%" stop-color="#d9d9d9" stop-opacity="0"/>
      <stop offset="45%" stop-color="#d9d9d9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d9d9d9" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softBlur" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css');
      .label, .timer, .legend {
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        fill: #fff;
      }
      .label { font-size: 36px; font-weight: 400; }
      .timer { font-size: 112px; font-weight: 200; }
      .legend { font-size: 18px; font-weight: 500; fill: rgba(255,255,255,0.55); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#1c1b1c"/>

  <text class="label" x="960" y="430" text-anchor="middle">1H BAR</text>
  <text class="timer" x="960" y="548" text-anchor="middle">42:00</text>

  <!-- Rays from left end of bar, ±45° -->
  <g transform="translate(0 580)">
    <g transform="rotate(-45)">
      <rect x="0" y="-4" width="1920" height="8" fill="url(#rayBlur)" filter="url(#softBlur)" opacity="0.9"/>
      <rect x="0" y="-4" width="1920" height="8" fill="url(#rayFade)"/>
    </g>
    <g transform="rotate(45)">
      <rect x="0" y="-4" width="1920" height="8" fill="url(#rayBlur)" filter="url(#softBlur)" opacity="0.9"/>
      <rect x="0" y="-4" width="1920" height="8" fill="url(#rayFade)"/>
    </g>
  </g>

  <!-- Full-bleed track -->
  <rect x="0" y="580" width="1920" height="8" fill="#494949"/>

  <!-- 0–38% focus · 38–46% rest · 46–70% focus (active) -->
  <rect x="0" y="580" width="729.6" height="8" fill="#98a098"/>
  <rect x="729.6" y="580" width="153.6" height="8" fill="#6e6e6e"/>
  <rect x="883.2" y="580" width="460.8" height="8" fill="url(#activeTip)"/>

  <circle cx="1344" cy="584" r="10" fill="url(#tipGlow)">
    <animate attributeName="opacity" values="0.55;1;0.55" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <g fill="rgba(255,255,255,0.55)">
    <rect x="0" y="580" width="1" height="8"/>
    <rect x="383.5" y="580" width="1" height="8"/>
    <rect x="767.5" y="580" width="1" height="8"/>
    <rect x="1151.5" y="580" width="1" height="8"/>
    <rect x="1535.5" y="580" width="1" height="8"/>
    <rect x="1919" y="580" width="1" height="8"/>
  </g>

  <g transform="translate(960 680)">
    <g transform="translate(-170 0)">
      <rect x="0" y="-9" width="12" height="12" rx="2" fill="#98a098"/>
      <text class="legend" x="22" y="2">??</text>
    </g>
    <g transform="translate(-30 0)">
      <rect x="0" y="-9" width="12" height="12" rx="2" fill="#6e6e6e"/>
      <text class="legend" x="22" y="2">??</text>
    </g>
    <g transform="translate(110 0)">
      <rect x="0" y="-9" width="12" height="12" rx="2" fill="#494949"/>
      <text class="legend" x="22" y="2">?? ??</text>
    </g>
  </g>
</svg>
